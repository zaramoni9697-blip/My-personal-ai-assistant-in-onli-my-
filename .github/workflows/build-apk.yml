name: JARVIS AI - Build Android Debug APK

on:
  workflow_dispatch:

  push:
    paths:
      - 'android/**'
      - 'shared/providers.json'
      - '.github/workflows/build-apk.yml'

  pull_request:
    paths:
      - 'android/**'
      - 'shared/providers.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JARVIS AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Project Files
        working-directory: android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f ../shared/providers.json

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
